[mgr]
show_hidden = true

[opener]
windows_pdf = [
  { run = "nvim-open %s1", desc = "Open PDF in Windows", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.pdf", use = "windows_pdf" },
]

[plugin]
prepend_previewers = [
  { url = "*.bb", run = "piper -- bat -p --color=always --language=bash \"$1\"" },
  { url = "*.bbappend", run = "piper -- bat -p --color=always --language=bash \"$1\"" },
  { url = "*.bbclass", run = "piper -- bat -p --color=always --language=bash \"$1\"" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "vscode-git-colors"
group = "vscode-git-colors"

[[plugin.prepend_fetchers]]
url = "*/"
run = "vscode-git-colors"
group = "vscode-git-colors"
